apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hornkeeper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hornkeeper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hornkeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hornkeeper.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hornkeeper.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hornkeeper
          image: {{ include "hornkeeper.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--longhorn-namespace=%s" .Values.controller.longhornNamespace | quote }}
            - {{ printf "--default-backup-target=%s" .Values.controller.defaultBackupTarget | quote }}
            - {{ printf "--default-replicas=%v" .Values.controller.defaultReplicas | quote }}
            - {{ printf "--leader-elect=%v" .Values.controller.leaderElection | quote }}
            - {{ printf "--leader-election-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--resync-interval=%s" .Values.controller.resyncInterval | quote }}
            - --metrics-bind-address={{ ternary ":8080" "0" .Values.metrics.enabled }}
            - --health-probe-bind-address=:8081
            - {{ printf "--log-level=%s" .Values.controller.logLevel | quote }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8080
            {{- end }}
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
