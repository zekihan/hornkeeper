version: 2
project_name: hornkeeper
builds:
  - id: all
    main: ./cmd/hornkeeper
    binary: hornkeeper
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - id: all
    ids: [all]
    formats: [tar.gz]
    files: [LICENSE, README.md, deploy/**, examples/**, docs/**, charts/hornkeeper/**]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  github:
    owner: zekihan
    name: hornkeeper
  ids: [all]
