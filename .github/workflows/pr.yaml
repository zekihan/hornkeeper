name: Checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m --build-tags=integration
      - name: Check formatting and modules
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: make test build test/integration
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          install-only: true
          version: v2.18.3
      - run: make release-check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make container-test
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - name: Install chart test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install -r tests/helm/requirements.txt
      - run: make chart-package PYTHON="$RUNNER_TEMP/chart-venv/bin/python"
