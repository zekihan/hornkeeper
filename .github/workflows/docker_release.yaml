name: Container Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/pr.yaml
  build:
    needs: checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set release version
        id: version
        run: echo "version=$(./scripts/release_version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image.tar
          build-args: VERSION=${{ steps.version.outputs.version }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Package and checksum artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          mv /tmp/image.tar dist/image.tar
          helm package charts/hornkeeper --destination dist --version "$VERSION" --app-version "$VERSION"
          cd dist
          sha256sum -- image.tar ./*.tgz > checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: container-and-chart
          path: |
            dist/image.tar
            dist/*.tgz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify artifacts
        working-directory: dist
        run: sha256sum --strict --check checksums.txt
      - name: Install image publisher
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Publish verified image and chart
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          export HELM_REGISTRY_CONFIG="$RUNNER_TEMP/helm-registry.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE" "$HELM_REGISTRY_CONFIG"' EXIT
          printf '%s' "$DOCKER_PASSWORD" | skopeo login --username "$DOCKER_USERNAME" --password-stdin docker.io
          printf '%s' "$GITHUB_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
          tags=("$VERSION" "sha-${COMMIT:0:7}")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" != *-* ]]; then
            tags+=("${VERSION%%.*}" latest)
          fi
          for image in "docker.io/$DOCKER_USERNAME/${REPOSITORY##*/}" "ghcr.io/${REPOSITORY,,}"; do
            for tag in "${tags[@]}"; do
              skopeo copy --all --preserve-digests oci-archive:dist/image.tar "docker://$image:$tag"
            done
          done
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/hornkeeper-${VERSION}.tgz" "oci://ghcr.io/${REPOSITORY_OWNER,,}/charts"
